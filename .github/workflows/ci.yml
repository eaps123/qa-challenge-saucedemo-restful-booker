name: QA Automation CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:

  # =========================================================
  # API TESTS - RESTFUL BOOKER
  # =========================================================
  api-tests:
    name: ⚙️ API Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🎭 Instalar browsers do Playwright
        run: npx playwright install --with-deps

      - name: 📁 Criar diretórios de reports
        run: |
          mkdir -p reports
          mkdir -p test-results

      - name: ⚙️ Executar testes API
        run: npm run test:api

      - name: 📊 Upload report API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            reports/
            test-results/

  # =========================================================
  # E2E TESTS - SAUCEDEMO
  # =========================================================
  e2e-tests:
    name: 🧪 E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🎭 Instalar browsers do Playwright
        run: npx playwright install --with-deps

      - name: 📁 Criar diretórios de evidências
        run: |
          mkdir -p reports/screenshots
          mkdir -p reports/videos

      - name: 🧪 Executar testes E2E
        run: npm run test:e2e

      - name: 📊 Gerar relatório HTML
        if: always()
        run: npm run report

      - name: 📁 Upload evidências E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            reports/
            test-results/

  # =========================================================
  # PERFORMANCE TESTS - RESTFUL BOOKER
  # =========================================================
  performance-tests:
    name: 🚀 Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 📁 Criar diretório K6
        run: mkdir -p reports/k6

      - name: ⚡ Instalar K6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: 🚀 Executar testes de performance
        run: |
          k6 run performance/load-test.js \
            --summary-export=reports/k6/k6-summary.json

      - name: 📈 Gerar análise de performance
        if: always()
        run: npm run report:performance

      - name: 📁 Upload report performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            reports/k6/
            reports/performance-analysis.json

  # =========================================================
  # DEPLOY REPORTS - GITHUB PAGES
  # =========================================================
  deploy-report:
    name: 🌐 Deploy Reports
    needs:
      - api-tests
      - e2e-tests
      - performance-tests

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # =====================================================
      # DOWNLOAD ARTIFACTS
      # =====================================================

      - name: 📥 Download API report
        uses: actions/download-artifact@v4
        with:
          name: api-report
          path: artifacts/api

      - name: 📥 Download E2E report
        uses: actions/download-artifact@v4
        with:
          name: e2e-report
          path: artifacts/e2e

      - name: 📥 Download Performance report
        uses: actions/download-artifact@v4
        with:
          name: performance-report
          path: artifacts/performance

      # =====================================================
      # BUILD PUBLIC FOLDER
      # =====================================================

      - name: 📁 Criar estrutura pública
        run: |
          mkdir -p public

          # index principal
          cp artifacts/e2e/reports/index.html public/index.html || true

          # screenshots
          cp -r artifacts/e2e/reports/screenshots public/ || true

          # videos
          cp -r artifacts/e2e/reports/videos public/ || true

          # playwright html report
          cp -r artifacts/e2e/reports/playwright-report public/ || true

          # k6
          cp -r artifacts/performance/reports/k6 public/ || true

          # performance analysis
          cp artifacts/performance/reports/performance-analysis.json public/ || true

      - name: 🔍 Validar estrutura final
        run: ls -R public

      # =====================================================
      # DEPLOY GH PAGES
      # =====================================================

      - name: 🚀 Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          force_orphan: true